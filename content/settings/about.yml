eyebrow: Что такое «Сила ума»
title: Технопарк для тех, кто строит будущее руками
body: >-
  «Сила ума» — детский технопарк, открытый 24 августа 2026 года в Цхинвале на
  базе Республиканской станции юных техников. Проект реализован при поддержке
  Министерства просвещения России и фонда «Моя история».


  Опорным вузом-куратором образовательной деятельности технопарка определён
  Российский государственный педагогический университет им. А. И. Герцена —
  университет проводит экспертизу образовательных программ и обеспечивает
  методическую поддержку.


  На первом этаже здания СЮТ размещено 880 единиц учебного оборудования для
  занятий по шести направлениям. Технопарк работает не только с детьми и
  студентами, но и предлагает курсы повышения квалификации и мастер-классы для
  педагогов.
